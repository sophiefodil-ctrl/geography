<!DOCTYPE html>
<html lang="en">
<head><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e2420">
<title>Greek Geography P.E.G.P.</title>
<style>
:root{
  --bg:#0e2420;
  --panel:#16352e;
  --panel2:#1d423a;
  --card:#f7f3e8;
  --ink:#1b2320;
  --accent:#37a88c;
  --accent2:#2c8b73;
  --live:#37a88c;
  --known:#7fbf5a;
  --almost:#4ec9d6;
  --important:#e0873c;
  --dim:#8fb0a6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  font-family:"Helvetica Neue",Helvetica,Arial,"Noto Sans","DejaVu Sans",sans-serif;
  color:#e9f2ee;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  max-width:640px;margin:0 auto;
  min-height:100vh;
}
header{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 14px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}
h1 em{font-style:italic;color:var(--accent);font-weight:700}
#counter{font-size:12px;color:var(--dim)}

.piles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}
.pile{
  background:var(--panel);border:1px solid rgba(255,255,255,.07);
  border-left:4px solid var(--live);
  border-radius:9px;padding:9px 6px;text-align:left;cursor:pointer;
  color:inherit;font-family:inherit;
}
.pile:disabled{opacity:.45}
.pile.known{border-left-color:var(--known)}
.pile.almost{border-left-color:var(--almost)}
.pile.important{border-left-color:var(--important)}
.pile .num{font-size:19px;font-weight:700;line-height:1}
.pile.live .num{color:var(--live)}
.pile.known .num{color:var(--known)}
.pile.almost .num{color:var(--almost)}
.pile.important .num{color:var(--important)}
.pile .lbl{font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);margin-top:5px}
.pile.active{outline:2px solid var(--accent);background:var(--panel2)}

#card{
  background:var(--card);color:var(--ink);border-radius:12px;
  padding:16px 15px 20px;min-height:330px;margin-bottom:12px;
}
.qnum{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#8a8677;margin-bottom:9px}
.instr{font-size:12.5px;line-height:1.45;color:#5f5c52;margin-bottom:11px}
.stem{font-size:19px;font-weight:700;line-height:1.42;margin-bottom:14px;white-space:pre-wrap}
.opts{list-style:none;margin:0;padding:0}
.opts li{
  display:flex;gap:9px;align-items:flex-start;
  font-size:15.5px;line-height:1.4;padding:10px 9px;border-top:1px solid #e2ddcd;
  border-radius:6px;cursor:pointer;
}
.opts li .k{font-weight:700;color:#6f6a5c;min-width:16px}
.opts li.right{background:#d8efd6}
.opts li.right .k{color:#2f7a3f}
.opts li.wrong{background:#f6d9d2}
.opts li.wrong .k{color:#a8442c}
.opts.locked li{cursor:default}

.answer{margin-top:16px;padding:14px 13px;background:#e5eef0;border-left:4px solid var(--accent2);border-radius:7px}
.answer .alabel{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#4b7a70;font-weight:700;margin-bottom:7px}
.answer .atext{font-size:15.5px;line-height:1.5;white-space:pre-wrap}
.answer img{width:100%;border-radius:5px;display:block;margin-top:4px}
.verdict{margin-top:14px;font-size:14px;font-weight:700}
.verdict.ok{color:#2f7a3f}
.verdict.no{color:#a8442c}

button{font-family:inherit}
.big{
  display:block;width:100%;padding:14px;border:0;border-radius:9px;
  background:var(--accent);color:#06201a;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:12px;
}
.big.ghost{background:var(--panel2);color:#cfe3dc}
.sortrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.sortrow button{
  background:var(--panel);border:1px solid rgba(255,255,255,.07);border-radius:9px;
  padding:11px 6px;color:#dceae5;cursor:pointer;font-size:13px;font-weight:700;line-height:1.3;
}
.sortrow button .sub{display:block;font-size:10px;font-weight:400;color:var(--dim);margin-top:3px}
.sortrow button.live{color:var(--live)}
.sortrow button.known{color:var(--known)}
.sortrow button.almost{color:var(--almost)}
.sortrow button.important{color:var(--important)}
.sortrow button.cur{outline:2px solid currentColor}
.navrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.navrow button{
  background:var(--panel);border:1px solid rgba(255,255,255,.07);border-radius:9px;
  padding:10px;color:#cfe3dc;font-size:13px;cursor:pointer;
}
footer{margin-top:18px;text-align:center}
footer button{background:none;border:0;color:#5d7d74;font-size:11.5px;text-decoration:underline;cursor:pointer;padding:8px}
#restoreFile{display:none}
.empty{text-align:center;color:#8a8677;font-size:15px;padding:60px 20px;line-height:1.6}
.hint{font-size:11.5px;color:var(--dim);text-align:center;margin:-4px 0 12px}
</style>
</head>
<body>
<header>
  <h1>Greek Geography <em>P.E.G.P.</em></h1>
  <div id="counter"></div>
</header>

<div class="piles">
  <button class="pile live active" id="pLive" onclick="selectPile('live')">
    <div class="num" id="nLive">0</div><div class="lbl">Live</div></button>
  <button class="pile known" id="pKnown" onclick="selectPile('known')">
    <div class="num" id="nKnown">0</div><div class="lbl">Known</div></button>
  <button class="pile almost" id="pAlmost" onclick="selectPile('almost')">
    <div class="num" id="nAlmost">0</div><div class="lbl">Almost</div></button>
  <button class="pile important" id="pImportant" onclick="selectPile('important')">
    <div class="num" id="nImportant">0</div><div class="lbl">Important</div></button>
</div>
<div class="hint" id="hint">Tap a pile above to study only that pile</div>

<div id="card"></div>
<div id="controls"></div>

<div class="navrow">
  <button onclick="prev()">← Back</button>
  <button onclick="shuffle()">Shuffle</button>
  <button onclick="next()">Next →</button>
</div>

<footer>
  <button onclick="backup()">Backup</button>
  <button onclick="document.getElementById('restoreFile').click()">Restore</button>
  <button onclick="resetAll()">Reset all progress</button>
  <input type="file" id="restoreFile" accept=".json,application/json" onchange="restore(this)">
</footer>

<script>
const QUESTIONS = [{"n": 1, "type": "mc", "instr": "Γράψτε στο τετράδιό σας τον αριθμό του θέματος και δίπλα τη σωστή απάντηση, σημειώνοντας το αντίστοιχο γράμμα (Α ή Β ή Γ ή Δ).", "stem": "Πόσες είναι οι Περιφερειακές Ενότητες της Ελλάδας;", "options": ["45", "40", "51", "74"], "answer": 3}, {"n": 2, "type": "mc", "instr": "Γράψτε στο τετράδιό σας τον αριθμό του θέματος και δίπλα τη σωστή απάντηση, σημειώνοντας το αντίστοιχο γράμμα (Α ή Β ή Γ ή Δ).", "stem": "Πόσος είναι ο πληθυσμός της Ελλάδας (σύμφωνα με την τελευταία απογραφή του 2021);", "options": ["8 εκατομμύρια περίπου", "7 εκατομμύρια περίπου", "15 εκατομμύρια περίπου", "10 εκατομμύρια περίπου"], "answer": 3}, {"n": 3, "type": "mc", "instr": "Γράψτε στο τετράδιό σας τον αριθμό του θέματος και δίπλα τη σωστή απάντηση, σημειώνοντας το αντίστοιχο γράμμα (Α ή Β ή Γ ή Δ).", "stem": "Ποια είναι η έκταση της Ελλάδας;", "options": ["120.000 τετραγωνικά χιλιόμετρα περίπου", "100.000 τετραγωνικά χιλιόμετρα περίπου", "90.000 τετραγωνικά χιλιόμετρα περίπου", "132.000 τετραγωνικά χιλιόμετρα περίπου"], "answer": 3}, {"n": 4, "type": "mc", "instr": "Γράψτε στο τετράδιό σας τον αριθμό του θέματος και δίπλα τη σωστή απάντηση, σημειώνοντας το αντίστοιχο γράμμα (Α ή Β ή Γ ή Δ).", "stem": "Η Ερμούπολη είναι πρωτεύουσα:", "options": ["της Νάξου", "της Σύρου", "της Περιφερειακής Ενότητας Λακωνίας", "της Περιφερειακής Ενότητας Αχαΐας"], "answer": 1}, {"n": 5, "type": "open", "instr": "Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό που αντιστοιχεί σε κάθε κενό, σημειώνοντας δίπλα τη λέξη ή τη φράση που ταιριάζει, επιλέγοντας από τις παρακάτω: <i>κόλπο, χερσόνησος, τρεις χερσονήσους, της Κεντρικής</i>", "stem": "Η Μαγνησία είναι (1) ……………………… (2) ……………………… Ελλάδας που σχηματίζει έναν κυκλικό (3) ……………………… .\nΗ Χαλκιδική βρίσκεται στη Βόρεια Ελλάδα και αποτελείται από (4) ………………………", "answer": "(1) χερσόνησος, (2) της Κεντρικής, (3) κόλπο, (4) τρεις χερσονήσους"}, {"n": 6, "type": "open", "instr": "Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τέσσερις (4) από τις (13) Διοικητικές Περιφέρειες της Ελλάδας.", "stem": "", "answer": "Η Ελλάδα αποτελείται συνολικά από 13 Διοικητικές Περιφέρειες: Ανατολικής Μακεδονίας και Θράκης, Αττικής, Βορείου Αιγαίου, Δυτικής Ελλάδας, Δυτικής Μακεδονίας, Ηπείρου, Θεσσαλίας, Ιονίων Νήσων, Κεντρικής Μακεδονίας, Κρήτης, Νοτίου Αιγαίου, Πελοποννήσου, Στερεάς Ελλάδας."}, {"n": 7, "type": "open", "instr": "Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό της κάθε πρότασης, σημειώνοντας Σ, αν η πρόταση που σας δίνεται παρακάτω είναι σωστή, ή Λ, αν είναι λάθος.", "stem": "1. Στους υγρότοπους της Ελλάδας μεταναστεύουν χιλιάδες πουλιά\n2. Στην Κρήτη ζει ένα είδος αγριόγιδου με την ονομασία Κρι-κρι\n3. Ο «Αρκτούρος» είναι καταφύγιο αρκούδας στο Νυμφαίο\n4. Στο θαλάσσιο πάρκο της Αλοννήσου αναπαράγεται η χελώνα καρέτα καρέτα (caretta caretta)", "answer": "(1) Σ, (2) Σ, (3) Σ, (4) Λ"}, {"n": 8, "type": "open", "instr": "Γράψτε στο τετράδιο σας τον αριθμό του θέματος και τέσσερα (4) νησιά του Ιονίου Πελάγους.", "stem": "", "answer": "Τα επτά κύρια νησιά είναι τα εξής (με σειρά μεγέθους): η Κεφαλονιά, η Κέρκυρα, η Ζάκυνθος, η Λευκάδα, τα Κύθηρα, η Ιθάκη και οι Παξοί."}, {"n": 9, "type": "open", "instr": "Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό που αντιστοιχεί σε κάθε κενό, σημειώνοντας δίπλα τη λέξη ή τη φράση που ταιριάζει, επιλέγοντας από τις παρακάτω: <i>αλιευμάτων, της Δυτικής, στον Αμβρακικό, Αιτωλοακαρνανίας</i>", "stem": "Η Βόνιτσα είναι κωμόπολη (1) ………………… Ελλάδας που βρίσκεται στην Περιφερειακή Ενότητα (2) ……………………… .\nΗ Κορωνησία είναι νησάκι (3) …………………………κόλπο, ο οποίος παράγει μεγάλη ποσότητα (4) ………………………", "answer": "(1) της Δυτικής, (2) Αιτωλοακαρνανίας, (3) στον Αμβρακικό, (4) αλιευμάτων"}, {"n": 10, "type": "open", "instr": "Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τα πελάγη από τα οποία βρέχεται η Κρήτη.", "stem": "", "answer": "Η Κρήτη βρέχεται από το Κρητικό και το Λιβυκό Πέλαγος."}, {"n": 1 const KEY = 'pegp_geo_v1';
let state = {};          // n -> 'live'|'known'|'important'
let pile = 'live';
let order = [];
let idx = 0;
let revealed = false;
let picked = null;

function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) state = JSON.parse(raw); }catch(e){}
  QUESTIONS.forEach(q => { if(!state[q.n]) state[q.n] = 'live'; });
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

function inPile(p){ return QUESTIONS.filter(q => state[q.n] === p); }

function counts(){
  document.getElementById('nLive').textContent = inPile('live').length;
  document.getElementById('nKnown').textContent = inPile('known').length;
  document.getElementById('nAlmost').textContent = inPile('almost').length;
  document.getElementById('nImportant').textContent = inPile('important').length;
  ['live','known','almost','important'].forEach(p=>{
    const el = document.getElementById('p'+p[0].toUpperCase()+p.slice(1));
    el.classList.toggle('active', p === pile);
  });
}

function buildOrder(keepCurrent){
  const cur = order[idx];
  order = inPile(pile).map(q => q.n);
  if(keepCurrent && cur !== undefined){
    const i = order.indexOf(cur);
    idx = i >= 0 ? i : Math.min(idx, Math.max(0, order.length - 1));
  } else { idx = 0; }
  if(idx < 0) idx = 0;
}

function selectPile(p){ pile = p; buildOrder(false); revealed=false; picked=null; render(); }

function shuffle(){
  for(let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  idx = 0; revealed = false; picked = null; render();
}
function next(){ if(!order.length) return; idx = (idx + 1) % order.length; revealed=false; picked=null; render(); }
function prev(){ if(!order.length) return; idx = (idx - 1 + order.length) % order.length; revealed=false; picked=null; render(); }

function q(){ return QUESTIONS.find(x => x.n === order[idx]); }

function sortTo(p){
  const cur = q(); if(!cur) return;
  state[cur.n] = p; save();
  counts(); render();
}

function reveal(){ revealed = true; render(); }

function pick(i){
  if(picked !== null) return;
  const cur = q();
  picked = i; revealed = true;
  state[cur.n] = (i === cur.answer) ? 'known' : 'important';
  save();
  render(true);
}

const L = ['Α','Β','Γ','Δ'];

function esc(s){ return s; }

function render(stay){
  counts();
  const card = document.getElementById('card');
  const ctr  = document.getElementById('controls');
  document.getElementById('hint').textContent =
    'Studying: ' + pile.charAt(0).toUpperCase() + pile.slice(1) + ' — tap a pile above to switch';

  if(!order.length){
    document.getElementById('counter').textContent = '0 / 0';
    card.innerHTML = '<div class="empty">This pile is empty.<br>Tap another pile above.</div>';
    ctr.innerHTML = '';
    return;
  }
  const cur = q();
  document.getElementById('counter').textContent = (idx + 1) + ' / ' + order.length;

  let h = '<div class="qnum">Question ' + cur.n + '</div>';
  h += '<div class="instr">' + cur.instr + '</div>';
  if(cur.stem) h += '<div class="stem">' + cur.stem + '</div>';

  if(cur.type === 'mc'){
    h += '<ul class="opts' + (picked !== null ? ' locked' : '') + '">';
    cur.options.forEach((o, i) => {
      let cls = '';
      if(picked !== null){
        if(i === cur.answer) cls = 'right';
        else if(i === picked) cls = 'wrong';
      }
      h += '<li class="' + cls + '" onclick="pick(' + i + ')"><span class="k">' + L[i] + '.</span><span>' + o + '</span></li>';
    });
    h += '</ul>';
    if(picked !== null){
      const ok = picked === cur.answer;
      h += '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' +
           (ok ? '✓ Correct — moved to Known' : '✗ Wrong — moved to Important. Correct answer: ' + L[cur.answer]) +
           '</div>';
    }
  } else if(revealed){
    h += '<div class="answer"><div class="alabel">Απάντηση</div>';
    if(cur.answer) h += '<div class="atext">' + cur.answer + '</div>';
    if(cur.img) h += '<img alt="map answer" src="' + cur.img + '">';
    h += '</div>';
  }
  card.innerHTML = h;

  let c = '';
  if(cur.type !== 'mc' && !revealed){
    c += '<button class="big" onclick="reveal()">Show answer</button>';
  }
  const show = (cur.type === 'mc') ? (picked !== null) : revealed;
  if(show){
    c += '<div class="sortrow">' +
      '<button class="live'      + (state[cur.n]==='live'?' cur':'')      + '" onclick="sortTo(\'live\')">Live<span class="sub">see again</span></button>' +
      '<button class="known'     + (state[cur.n]==='known'?' cur':'')     + '" onclick="sortTo(\'known\')">Known<span class="sub">I know it</span></button>' +
      '<button class="almost'    + (state[cur.n]==='almost'?' cur':'')    + '" onclick="sortTo(\'almost\')">Almost<span class="sub">nearly there</span></button>' +
      '<button class="important' + (state[cur.n]==='important'?' cur':'') + '" onclick="sortTo(\'important\')">Important<span class="sub">needs work</span></button>' +
      '</div>';
  }
  ctr.innerHTML = c;
  if(!stay) window.scrollTo(0,0);
}

function backup(){
  const payload = {app:'pegp-geography', version:1, saved:new Date().toISOString(), state:state};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  const d = new Date(), p = n => String(n).padStart(2,'0');
  a.href = URL.createObjectURL(blob);
  a.download = 'geography-pegp-backup-' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

function restore(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const data = JSON.parse(r.result);
      const incoming = data && data.state ? data.state : data;
      const valid = ['live','known','almost','important'];
      let n = 0, fresh = {};
      QUESTIONS.forEach(q => {
        const v = incoming[q.n];
        fresh[q.n] = valid.indexOf(v) >= 0 ? v : 'live';
        if(valid.indexOf(v) >= 0) n++;
      });
      if(!n) { alert('That file has no usable progress in it.'); return; }
      if(!confirm('Restore ' + n + ' cards from this backup? Your current progress will be replaced.')) return;
      state = fresh; save();
      pile = 'live'; buildOrder(false); revealed = false; picked = null; render();
    }catch(e){ alert("Couldn't read that file — is it a backup from this app?"); }
  };
  r.readAsText(file);
}

function resetAll(){
  if(!confirm('Reset all progress? Every question goes back to Live.')) return;
  QUESTIONS.forEach(q => state[q.n] = 'live');
  save(); pile = 'live'; buildOrder(false); revealed=false; picked=null; render();
}

load();
buildOrder(false);
render();
</script>
